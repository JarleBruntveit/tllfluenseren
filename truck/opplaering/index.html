function updateMoment(){const a=document.getElementById('mass'),b=document.getElementById('distance');if(!a||!b)return;const m=+a.value,d=+b.value/100;document.getElementById('massval').textContent=m+' kg';document.getElementById('distval').textContent=d.toLocaleString('nb-NO')+' m';document.getElementById('moment').textContent=(m*d).toLocaleString('nb-NO')+' kg·m';document.getElementById('loadbox').setAttribute('x',90+d*270-25)}
const hazardItems=[['En gangvei munner ut i truckens kjørerute','Vurder fysisk adskillelse og avklar krysningspunkt.'],['En pall står i gangveien','Rydd og sikre en fri gangvei før videre arbeid.'],['En dør gir dårlig sikt til kjøreruten','Planlegg sikker oversikt og avklar ferdselsrutinen.']];
function hazardLab(){return `<section class="card"><span class="tag">FINN RISIKOEN</span><h2 class="section">Tre forhold på lageret</h2><p data-speak>Du møter alle disse forholdene på samme lager. Åpne hvert punkt og forklar et tiltak før du leser forslaget.</p><div class="hazards">${hazardItems.map(([t,a],i)=>`<details><summary class="summary">${i+1}. ${t}</summary><p data-speak>${a}</p></details>`).join('')}</div><label for="hazard-note">Hvilket forhold vil du håndtere først, og hvorfor?</label><textarea class="note" id="hazard-note" data-note="hazard-${activeId}">${esc(state.notes['hazard-'+activeId]||'')}</textarea></section>`}
const orderSteps=['Sikre at kontrollen kan gjennomføres forsvarlig.','Kontroller etter truckens instruks og lokale rutine.','Ta ut trucken av bruk hvis du finner sikkerhetsfeil.','Rapporter og dokumenter observasjonen etter rutinen.'];let order=[2,0,3,1];let orderFeedback='';
function orderLab(){return `<section class="card"><span class="tag">SETT I REKKEFØLGE</span><h2 class="section">Kontroll med en sikkerhetsfeil</h2><p data-speak>Dette er en øvingsrekkefølge, ikke et komplett kontrollskjema. Flytt punktene med knappene.</p>${order.map((n,i)=>`<div class="orderitem"><span>${i+1}. ${orderSteps[n]}</span><button data-up="${i}" aria-label="Flytt punkt ${i+1} opp" ${i===0?'disabled':''}>↑</button><button data-down="${i}" aria-label="Flytt punkt ${i+1} ned" ${i===3?'disabled':''}>↓</button></div>`).join('')}<button class="primary section" id="checkorder">Sjekk rekkefølge</button><p class="section" role="status">${orderFeedback}</p></section>`}
function checkLab(l){const items=['Jeg kan forklare oppgaven før den starter.','Jeg kan beskrive en fare og et tiltak.','Jeg vet når jeg skal stanse og spørre instruktøren.'];return `<section class="card"><span class="tag">FØR SAMTALEN MED INSTRUKTØREN</span><h2 class="section">Min forberedelse</h2><div class="checklist">${items.map((t,i)=>`<label><input type="checkbox" data-check="${l.id}-${i}" ${state.checks[l.id+'-'+i]?'checked':''}><span>${t}</span></label>`).join('')}</div><p class="small muted section">Avhuking viser egen forberedelse. Den bekrefter ikke ferdighet, gjennomført praksis eller bestått prøve.</p></section>`}
function quizPart(l){const q=l.quiz[qIndex],key=l.id+'-q'+qIndex,ans=state.answers[key],sel=ans?.choice;return `<article class="card"><span class="tag">ØVING · SPØRSMÅL ${qIndex+1} AV ${l.quiz.length}</span><h2 class="section">${q.q}</h2><p class="small muted">Ett spørsmål om gangen. Du kan øve flere ganger. Dette er ikke en eksamen.</p><div role="group" aria-label="Svaralternativer">${q.options.map((o,i)=>`<button class="choice ${sel===i?'selected':''}" data-answer="${i}" aria-pressed="${sel===i}">${String.fromCharCode(65+i)} · ${o}</button>`).join('')}</div><button id="checkquiz" class="primary" ${sel===undefined?'disabled':''}>Sjekk svaret</button>${quizFeedback?`<div class="feedback ${sel===q.correct?'':'retry'}" role="status"><strong>${sel===q.correct?'Riktig.':'Øv litt mer.'}</strong><p data-speak>${q.why}</p></div>`:''}<div class="row section"><button id="prevq" ${qIndex===0?'disabled':''}>← Forrige spørsmål</button><button id="nextq" ${qIndex===l.quiz.length-1?'disabled':''}>Neste spørsmål →</button></div></article>`}
function reflectPart(l){const done=state.done.includes(l.id);return `<article class="card"><span class="tag green">TA DET MED DEG</span><h2 class="section">Hva vil du gjøre annerledes?</h2><p data-speak>Skriv eller si én ting du lærte, og én ting du vil ha hjelp til. Du kan også bruke taleinntasting på enheten din.</p><label for="reflection">Min oppsummering</label><textarea class="note" id="reflection" data-note="reflect-${l.id}" placeholder="Jeg har lært … Jeg vil øve på …">${esc(state.notes['reflect-'+l.id]||'')}</textarea><button id="done" class="${done?'':'primary'}">${done?'✓ Arbeidet med · fjern markering':'Marker som arbeidet med'}</button><p class="small muted section">Dette er din egen fremdriftsmarkering, ikke en vurdering fra lærer.</p><button id="nextlesson">Neste leksjon →</button></article>`}

function teacherPage(){
 if(!teacherPlans||Date.now()>teacherExpires){teacherPlans=null;return `<div class="eyebrow">Tilgang for lærere</div><h1>Logg inn i lærerrommet</h1><article class="card" style="max-width:570px"><h2>Velkommen, lærer</h2><p>Skriv inn lærerpassordet for å åpne øktplaner, vurderingsstøtte og veiledende svar.</p><form id="teacher-login"><label for="teacher-password"><strong>Passord</strong></label><input id="teacher-password" name="password" type="password" autocomplete="current-password" required style="display:block;width:100%;padding:14px;border:1px solid var(--line);border-radius:8px;margin:12px 0;color:var(--ink);background:var(--paper)"><label class="row small"><input id="show-password" type="checkbox"> Vis passord</label><button id="login-submit" type="submit" class="primary section">Logg inn</button><p id="login-error" class="section" role="alert" aria-live="polite"></p></form><p class="small muted section">Innloggingen gjelder denne fanen i inntil én time. Du logges ut ved omlasting. Passordet lagres ikke på enheten.</p><button data-nav="home">← Til elevrommet</button></article>`}
 const plan=teacherPlans.find(p=>p.id===activeId)||teacherPlans[0];return plan.html;
}
function overviewPage(){return `<div class="eyebrow">Egen læring</div><h1>Min oversikt</h1><article class="card"><h2>Arbeidet på denne enheten</h2><p>Fremdrift, øvingssvar og elevnotater lagres i denne nettleseren. Oversikten er ikke en lærervurdering.</p><p><strong>${state.done.length}</strong> av 26 leksjoner markert. <strong>${Object.values(state.answers).filter(x=>x&&typeof x==='object'&&x.checked).length}</strong> øvingsspørsmål har et kontrollert svar.</p><div class="row"><button id="export">Last ned min oversikt</button><button id="reset">Slett lokalt arbeid</button></div><p class="small muted section">Elevens eksport inneholder ikke undervisningsnotater fra lærerrommet. Ikke legg inn navn eller personopplysninger.</p></article>`}
async function unlockTeacher(event){
 event.preventDefault();const field=document.getElementById('teacher-password'),button=document.getElementById('login-submit'),error=document.getElementById('login-error');
 if(!window.crypto?.subtle){error.textContent='Denne nettleseren kan ikke åpne lærerrommet her. Bruk en oppdatert nettleser og HTTPS, eller åpne den nedlastede filen lokalt.';return}
 button.disabled=true;button.textContent='Åpner …';error.textContent='';
 const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 try{
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value.normalize('NFC')),'PBKDF2',false,['deriveKey']);
  field.value='';
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(teacherCipher.salt),iterations:teacherCipher.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(teacherCipher.iv)},key,bytes(teacherCipher.data));
  const decoded=JSON.parse(new TextDecoder().decode(plain));if(!Array.isArray(decoded)||decoded.length!==26)throw new Error('Invalid content');
  teacherPlans=decoded;teacherExpires=Date.now()+3600000;
  if(view==='teacher'){render();main.focus()}
 }catch(e){field.value='';button.disabled=false;button.textContent='Logg inn';error.textContent='Feil passord. Prøv igjen.';field.focus()}
}
setInterval(()=>{if(teacherPlans&&Date.now()>teacherExpires){teacherPlans=null;teacherExpires=0;if(view==='teacher')render()}},30000);

function settingsPage(){return `<div class="settings"><div class="eyebrow">Velg det som fungerer for deg</div><h1>Lesestøtte</h1><p>Korte bolker og valgfritt tempo for alle elever. Ingen av innstillingene endrer læringsmålene.</p><div class="card"><h3>Tekst og bakgrunn</h3><div class="grid"><div><label for="size">Tekststørrelse</label><select id="size"><option value="18">Vanlig · 18 px</option><option value="20">Stor · 20 px</option><option value="24">Ekstra stor · 24 px</option></select></div><div><label for="theme">Bakgrunn</label><select id="theme"><option value="">Nettstedets standard</option><option value="cream">Varm og rolig</option><option value="contrast">Mørk med høy kontrast</option></select></div></div><label class="check section"><input id="wide" type="checkbox" ${state.settings.wide?'checked':''}><span>Ekstra linjeavstand og litt mer luft mellom bokstavene</span></label><label class="check"><input id="focus" type="checkbox" ${state.settings.focus?'checked':''}><span>Fokusmodus · skjul modulmenyen</span></label></div><div class="card"><h3>Opplesning</h3><p>Bruker talesyntesen på enheten. Norsk stemme og uttalekvalitet avhenger av nettleser og installerte stemmer. Tekstbolken som leses markeres.</p><label for="voice">Stemme</label><select id="voice"></select><label for="rate" class="section">Lesehastighet</label><select id="rate"><option value="0.7">Rolig</option><option value="0.9">Vanlig</option><option value="1.1">Raskere</option></select><div class="row section"><button id="testvoice">Prøv stemmen</button><button id="stop">Stopp</button></div><p id="voicestatus" class="small muted section" role="status"></p></div><div class="card"><h3>Prøv lesingen</h3><p>Før du kjører: Se på lasten. Se på området. Si fra når noe er uklart.</p><button data-lesson="${activeId}" class="primary">Tilbake til leksjonen →</button></div></div>`}
function sourcePage(){return `<div class="eyebrow">Faggrunnlag og avklaringer</div><h1>Kilder og modulstruktur</h1><article class="card"><h3>Opplastet materiale</h3><p>Grunnboken dekker modul 1 og inneholder også truckteori. Den separate spesialdelen brukes som primær henvisning for modul 2.2, slik at samme innhold ikke dobles.</p><p>Modul 1 har seks leksjoner. Modul 2.2 har åtte. De 14 separate leksjonsfilene er bildebaserte kopier; fagtekst i testversjonen er sammenfattet fra de søkbare samlefilene, ikke OCR-avskrift av hver side.</p><p>Filen «Modul 2 øeksjon 6.pdf» handler om farlig gods og er plassert under modul 1, leksjon 6 etter innholdet.</p><p>Originale prøver og fasiter er ikke gjengitt. Elevoppgavene er nyformulert. Ingen original-PDF-er er distribuert i denne filen.</p></article><article class="card section"><h3>Eksterne kilder</h3>${Object.values(sources).map(s=>`<p><strong>${s.url?`<a href="${s.url}" target="_blank" rel="noopener">${s.name}</a>`:s.name}</strong><br>${s.note}</p>`).join('')}<p class="small muted">Kildene er undersøkt 23. oktober 2026. NDLA-oversikten er brukt som videre lenke; fullstendig innhold i underressursene er ikke kontrollert.</p></article><article class="card section"><h3>Dette må avklares før ordinær bruk</h3><p><strong>Faglig gjennomgang:</strong> Lærer og sertifisert opplæringsvirksomhet må kontrollere opplegg mot gjeldende planer, aktuelle truckklasser og lokale instrukser.</p><p><strong>Versjon for modul 3.2:</strong> Den åpne lenken viser juni 2022. Et søkeresultat viser også en revidert september 2022-utgave, men den lenken krevde innlogging. Gjeldende utgave og praksisfordeling må bekreftes før gjennomføring. Testfilen fastsetter ikke praksistimer.</p><p><strong>Tilgang:</strong> Lærerrommets innhold er kryptert og åpnes med et felles lærerpassord. Passordet lagres ikke i filen. Dette gir ikke personlige brukerkontoer. Elevøvelsene er åpne og er ikke beskyttede eksamensoppgaver.</p><p><strong>Prøve:</strong> Her finnes bare formative øvelser. Ingen SEB-integrasjon, offisiell eksamen, praksisgodkjenning eller kompetansebevis er implementert.</p><p><strong>Fremdrift:</strong> Lokal nettleserlagring uten konto eller synkronisering. Ingen elevresultater sendes til lærer. Ikke legg inn personopplysninger.</p><p><strong>Tilgjengelighet:</strong> Lesestøtten må prøves med faktiske elever og hjelpemidler. Denne siden er ikke en attestasjon av full universell utforming.</p></article><button class="section" data-nav="home">Til elevrommet</button>`}
function speakText(parts){stopSpeech();if(!('speechSynthesis'in window)){document.getElementById('status').textContent='Nettleseren støtter ikke opplesning. Bruk enhetens leseverktøy.';return}const voices=speechSynthesis.getVoices();const chosen=voices.find(v=>v.voiceURI===state.settings.voice)||voices.find(v=>/^nb|^no|^nn/i.test(v.lang));if(!chosen){document.getElementById('status').textContent='Ingen norsk stemme er tilgjengelig ennå. Prøv igjen eller velg stemme i lesestøtte.';return}const token=speechToken;let i=0;const next=()=>{if(token!==speechToken||i>=parts.length)return;document.querySelectorAll('.speaking').forEach(p=>p.classList.remove('speaking'));const p=parts[i++];p.element?.classList.add('speaking');const u=new SpeechSynthesisUtterance(p.text);u.lang=chosen.lang;u.voice=chosen;u.rate=+state.settings.rate||.9;u.onend=()=>{p.element?.classList.remove('speaking');next()};u.onerror=()=>{p.element?.classList.remove('speaking');document.getElementById('status').textContent='Opplesningen ble avbrutt. Prøv igjen eller bruk enhetens leseverktøy.'};speechSynthesis.speak(u)};document.getElementById('status').textContent='Leser med '+chosen.name;next()}
function readCurrent(){const area=document.getElementById('reading-area');if(!area)return;const all=[...area.querySelectorAll('h2,h3,[data-speak],.choice,.flash')].filter(e=>!e.closest('details')||e.closest('details').open);speakText(all.map(e=>({text:e.textContent,element:e})))}
function fillVoices(){const v=document.getElementById('voice');if(!v)return;if(!('speechSynthesis'in window)){v.innerHTML='<option>Ikke støttet i denne nettleseren</option>';return}const voices=speechSynthesis.getVoices();v.innerHTML='<option value="">Automatisk norsk stemme</option>'+voices.map(x=>`<option value="${esc(x.voiceURI)}">${esc(x.name)} (${esc(x.lang)})</option>`).join('');v.value=state.settings.voice;document.getElementById('voicestatus').textContent=voices.some(x=>/^nb|^no|^nn/i.test(x.lang))?'Norsk stemme tilgjengelig.':'Ingen norsk stemme funnet. Tilgjengelige stemmer kan lastes litt senere av nettleseren.'}
function download(){const publicNotes=Object.fromEntries(Object.entries(state.notes).filter(([k])=>!k.startsWith('teacher-')));const report={title:'Min truckoversikt – egen øving, ikke sertifiseringsdokumentasjon',exported:new Date().toISOString(),...state,notes:publicNotes};const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='min-truckoversikt.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{activeModule=b.dataset.module;nav('module')});document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(b.dataset.lesson));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{stopSpeech();tab=b.dataset.tab;quizFeedback=false;caseFeedback=false;render()});document.querySelectorAll('[data-note]').forEach(e=>e.oninput=()=>{state.notes[e.dataset.note]=e.value;persist()});const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn};const tabs=['learn','case','words','explore','quiz','reflect'];on('prevtab',()=>{stopSpeech();tab=tabs[tabs.indexOf(tab)-1];render()});on('nexttab',()=>{stopSpeech();tab=tabs[tabs.indexOf(tab)+1];render()});const lev=document.getElementById('level');if(lev){lev.value=state.settings.level;lev.onchange=()=>{state.settings.level=lev.value;persist();stopSpeech();render()}}on('read',readCurrent);on('stop',stopSpeech);on('pause',()=>{if('speechSynthesis'in window){if(speechSynthesis.paused)speechSynthesis.resume();else speechSynthesis.pause()}});on('testvoice',()=>speakText([{text:'Før du kjører: Se på lasten. Se på området. Si fra når noe er uklart.'}]));
 const l=lessons.find(l=>l.id===activeId);document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{state.answers['case-'+l.id]=+b.dataset.case;caseFeedback=false;persist();render()});on('checkcase',()=>{caseFeedback=true;render()});document.querySelectorAll('[data-flip]').forEach(b=>b.onclick=()=>{const k=l.id+'-'+b.dataset.flip;flipped[k]=!flipped[k];render()});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{state.answers[l.id+'-q'+qIndex]={choice:+b.dataset.answer,checked:false};quizFeedback=false;persist();render()});on('checkquiz',()=>{state.answers[l.id+'-q'+qIndex].checked=true;quizFeedback=true;persist();render()});on('prevq',()=>{qIndex--;quizFeedback=false;render()});on('nextq',()=>{qIndex++;quizFeedback=false;render()});on('done',()=>{state.done=state.done.includes(l.id)?state.done.filter(x=>x!==l.id):[...state.done,l.id];persist();render()});on('nextlesson',()=>openLesson(lessons[(lessons.findIndex(x=>x.id===l.id)+1)%lessons.length].id));document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{state.checks[e.dataset.check]=e.checked;persist()});for(const id of ['mass','distance']){const e=document.getElementById(id);if(e)e.oninput=updateMoment}document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[order[i],order[i-1]]=[order[i-1],order[i]];orderFeedback='';render()});document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{const i=+b.dataset.down;[order[i],order[i+1]]=[order[i+1],order[i]];orderFeedback='';render()});on('checkorder',()=>{orderFeedback=order.every((x,i)=>x===i)?'Riktig øvingsrekkefølge. Følg alltid aktuell kontrollrutine.':'Se på rekkefølgen igjen: sikre først, kontroller, håndter feilen og rapporter.';render()});
 const loginForm=document.getElementById('teacher-login');if(loginForm)loginForm.onsubmit=unlockTeacher;const showPassword=document.getElementById('show-password');if(showPassword)showPassword.onchange=()=>{document.getElementById('teacher-password').type=showPassword.checked?'text':'password'};on('logout',()=>{teacherPlans=null;teacherExpires=0;stopSpeech();render();main.focus()});if(view==='teacher'&&teacherPlans)document.querySelectorAll('[data-note]').forEach(e=>{e.value=state.notes[e.dataset.note]||''});
 const t=document.getElementById('teacherlesson');if(t)t.onchange=()=>{activeId=t.value;render()};on('print',()=>window.print());on('export',download);on('reset',()=>{if(confirm('Slette all fremdrift, svar og notater fra denne nettleseren? Lesestøtte beholdes. Last ned oversikten først hvis du vil beholde arbeidet.')){state.done=[];state.notes={};state.answers={};state.checks={};persist();render()}});const f=document.getElementById('localpdf');if(f)f.onchange=()=>{const file=f.files[0];if(file){if(file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf'))return;const u=URL.createObjectURL(file);const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.click();setTimeout(()=>URL.revokeObjectURL(u),60000)}};
 for(const id of ['size','theme','rate','voice','wide','focus']){const e=document.getElementById(id);if(e){if(e.type!=='checkbox')e.value=state.settings[id];e.onchange=()=>{state.settings[id]=e.type==='checkbox'?e.checked:e.value;persist();applySettings();if(id==='voice'||id==='rate')stopSpeech()}}}}
if('speechSynthesis'in window)speechSynthesis.addEventListener('voiceschanged',fillVoices);window.addEventListener('pagehide',stopSpeech);render();
</script></body></html>
