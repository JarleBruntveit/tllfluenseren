<!doctype html>

<title>Kap 1 Lager og terminal – TLLfluenseren</title>

<style>
:root{
  --bg:#0b1117; --panel:#111a23; --ink:#f5f7f9; --muted:#aab7c4; --line:#2b3a48;
  --asphalt:#17232e; --yellow:#f2b84b; --yellow-ink:#111820;
  --ok:#8cd6ae; --ok-bg:#12301f; --bad:#ff8a7a; --bad-bg:#3a1d1a;
  --n1:#8cd6ae; --n2:#7db8f0; --n3:#f2955b;

}
:root[data-theme="light"]{
  --bg:#f3f1ec; --panel:#ffffff; --ink:#1b2128; --muted:#5c6670; --line:#d9d5cc;
  --asphalt:#1f262e; --yellow:#f2b84b; --yellow-ink:#111820;
  --ok:#1f8a4c; --ok-bg:#e3f4ea; --bad:#c0392b; --bad-bg:#fbe7e4;

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(circle at 20% 0%,rgba(23,40,56,.9) 0,transparent 35%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.5}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:inherit;font-weight:900;letter-spacing:-.02em;line-height:1.1;margin:0}

/* Topp */
header.top{background:var(--asphalt);color:#fff;border-bottom:6px solid var(--yellow);position:relative}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;
  background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,#1b2128 14px 28px);opacity:.9}
.top .wrap{padding-top:22px;padding-bottom:26px}
.crumbs{font-size:14px;color:#c9d0d6;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.35)}
.top h1{font-size:clamp(30px,6vw,46px);margin-top:8px;letter-spacing:.2px}
.top .sub{color:#c9d0d6;margin-top:6px;max-width:60ch}
.km{margin-top:14px;display:inline-flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);padding:10px 12px;border-radius:8px;font-size:15px;max-width:100%}
.km b{color:var(--yellow);white-space:nowrap}

/* Nivåvelger */
.levelbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.levelbar .wrap{display:flex;gap:10px;align-items:center;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.levelbar .lbl{font-weight:600;font-size:14px;color:var(--muted);margin-right:2px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--panel);padding:5px 12px;border-radius:999px;font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.seg button .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools{margin-left:auto;display:flex;gap:6px}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:16px}
@media (max-width:560px){
  .levelbar .wrap{flex-wrap:nowrap;gap:6px}
  .levelbar .lbl{display:none}
  .seg{flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;gap:4px;scrollbar-width:none}
  .seg button{padding:4px 7px;font-size:13px;white-space:nowrap;border-width:1.5px}
  .levelbar .iconbtn{padding:4px 7px}
  .seg button .dot{width:7px;height:7px;margin-right:3px}
  .tools{flex:none}
}

main{padding:22px 0 60px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.section-h h2{font-size:26px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Tema-kort (lokasjonsetiketter) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tcard{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;box-shadow:var(--shadow);overflow:hidden;transition:transform .12s}
.tcard:hover{transform:translateY(-2px)}
.tcard .lab{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.tcard .lok{background:var(--yellow);color:var(--yellow-ink);font-family:inherit;font-weight:800;font-size:22px;padding:8px 12px;letter-spacing:1px}
.tcard .bars{flex:1;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 14px);opacity:.14;margin:8px 10px}
.tcard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.tcard h3{font-size:22px}
.tcard p{margin:0;color:var(--muted);font-size:15px}
.prog{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:auto}
.prog i{display:block;height:100%;background:var(--ok);width:0}
.progtxt{font-size:13px;color:var(--muted)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.kort ul{margin:8px 0 0;padding-left:20px}
.kort li{margin:4px 0}
.reslist{list-style:none;margin:8px 0 0;padding:0}
.reslist li{padding:7px 0;border-top:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.reslist li:first-child{border-top:0}
.tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:5px;background:var(--line);color:var(--ink);white-space:nowrap}
.tag.ndla{background:#2b6cb0;color:#fff}
.brandlink{display:inline-flex;gap:8px;align-items:center;text-decoration:none;font-weight:900;color:#fff;margin-bottom:10px}
.brandlink .bm{width:30px;height:30px;border-radius:9px;background:var(--yellow);color:#111820;display:grid;place-items:center;font-size:11px}

/* Aktivitetskort */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.act{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);text-decoration:none}
.act:hover{border-color:var(--ink)}
.act[data-n="1"]{border-left-color:var(--n1)} .act[data-n="2"]{border-left-color:var(--n2)} .act[data-n="3"]{border-left-color:var(--n3)} .act[data-n="0"]{border-left-color:var(--yellow)}
.act .kind{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;display:flex;justify-content:space-between;gap:6px}
.act h4{margin:0;font-size:18px;font-weight:600;line-height:1.25}
.act .done{color:var(--ok);font-weight:700}
.lvl{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;color:#111820;white-space:nowrap}
.lvl.n1{background:var(--n1)} .lvl.n2{background:var(--n2)} .lvl.n3{background:var(--n3)} .lvl.n0{background:var(--yellow);color:var(--yellow-ink)}

/* Aktivitetsvisning */
.stage{max-width:760px;margin:0 auto}
.stage-h{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.stage-h h2{font-size:28px}
.instr{margin:0 0 14px;color:var(--muted)}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.counter{font-weight:600;color:var(--muted);font-size:15px}
.say{border:1px solid var(--line);background:var(--panel);border-radius:999px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.say svg{width:18px;height:18px}

/* Flashkort */
.flash{perspective:1200px;height:260px;margin:6px 0 14px}
.flash .inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flash.flipped .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;border:1px solid var(--line)}
.flash .front{background:var(--asphalt);color:#f5f7f9;font-family:inherit;font-size:clamp(28px,6vw,40px);font-weight:700}
.flash .back{background:var(--panel);transform:rotateY(180deg);font-size:19px}
.flash .hint{position:absolute;bottom:10px;left:0;right:0;font-size:13px;color:#aab3bb;font-weight:500}

/* Quiz */
.q{font-size:21px;font-weight:600;margin:4px 0 14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;font-size:17px;display:flex;gap:10px;align-items:flex-start}
.opt .k{font-weight:700;color:var(--muted);min-width:1.2em}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;border-left:5px solid var(--ok);background:var(--ok-bg)}
.fb.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 16px}
.meter i{display:block;height:100%;background:var(--yellow);transition:width .3s}

/* Koble */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.mi{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;text-align:left;font-size:16px;min-height:48px}
.mi.sel{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(245,179,1,.35)}
.mi.done{border-color:var(--ok);background:var(--ok-bg);cursor:default}
.mi.wrong{animation:shake .35s;border-color:var(--bad)}
.mi.left{font-weight:600}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Rekkefølge */
.olist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.oi{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px}
.oi .n{font-family:inherit;font-weight:800;font-size:22px;width:28px;text-align:center;color:var(--muted)}
.oi .t{flex:1}
.oi .mv{display:flex;flex-direction:column;gap:3px}
.oi .mv button{border:1px solid var(--line);background:var(--bg);border-radius:6px;width:34px;height:26px;line-height:1;font-size:14px}
.oi.ok{border-color:var(--ok);background:var(--ok-bg)}
.oi.bad{border-color:var(--bad);background:var(--bad-bg)}

/* Sortering */
.sitems{display:grid;gap:10px}
.si{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px}
.si .t{font-weight:600;margin-bottom:8px}
.si .cats{display:flex;gap:6px;flex-wrap:wrap}
.si .cats button{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:15px;font-weight:600}
.si .cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.si.ok{border-color:var(--ok);background:var(--ok-bg)}
.si.bad{border-color:var(--bad);background:var(--bad-bg)}
.si .why{font-size:14px;margin-top:6px;color:var(--muted)}

/* Regning */
.calc .task{font-size:19px;margin-bottom:12px}
.calc input{font:inherit;font-size:22px;width:150px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.calc .unit{font-weight:600;color:var(--muted)}
.steps{margin:8px 0 0;padding-left:20px}

/* Refleksjon */
textarea{width:100%;min-height:150px;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);resize:vertical}
.checks{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.checks input{width:20px;height:20px;margin-top:3px;flex:none}

/* Sim */
.simgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
@media (max-width:560px){.simgrid{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat .v{font-family:inherit;font-size:30px;font-weight:800;line-height:1}
.stat .l{font-size:13px;color:var(--muted)}
.chart{width:100%;height:170px;display:block;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.log{font-size:14px;color:var(--muted);max-height:120px;overflow:auto;margin-top:8px;padding-left:18px}

.result{text-align:center;padding:26px 10px}
.result .big{font-family:inherit;font-size:64px;font-weight:800;line-height:1}
.result .msg{font-size:19px;margin:6px 0 16px}

/* Læringsmål */
.mal{border-left:5px solid var(--yellow)}
.mal ul{margin:8px 0 0;padding-left:0;list-style:none;display:grid;gap:6px}
.mal li{display:flex;gap:10px;align-items:flex-start}
.mal li::before{content:"✓";color:var(--yellow);font-weight:900;flex:none}

/* Faser: Lær · Øv · Tenk · Voks */
.phase-steps{display:flex;gap:12px;flex-wrap:wrap;color:var(--yellow);font-weight:800;letter-spacing:.06em;font-size:14px}
.phase{margin-top:30px}
.phase-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.phase-h .pn{width:44px;height:44px;border-radius:12px;background:var(--yellow);color:var(--yellow-ink);display:grid;place-items:center;font-weight:900;font-size:13px;flex:none;line-height:1.05;text-align:center}
.phase-h .pn small{display:block;font-size:15px}
.phase-h h2{font-size:26px}
.phase-h p{margin:2px 0 0;color:var(--muted);font-size:15px}
.ftag{font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--yellow);text-transform:uppercase}

/* Lagring */
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-left:5px solid var(--n2);border-radius:10px;background:var(--panel);font-size:15px;margin:0 0 12px}
.note b{white-space:nowrap}
.note.warn{border-left-color:var(--n3)}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;font-weight:600;color:inherit}
.choice{display:grid;gap:8px;margin:10px 0}
.choice label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.choice input{width:20px;height:20px;margin-top:2px;flex:none}
.choice label:has(input:checked){border-color:var(--yellow)}

/* Podkast */
.pod{border-left:5px solid var(--yellow)}
.pod-ic{font-size:26px;line-height:1}
.spd{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px}
.spd[aria-pressed="true"]{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow)}

/* Voks */
.voks-text p{margin:0 0 10px;font-size:18px}
.voks-q{margin:14px 0 6px;font-weight:700}
.voks-do{border:2px dashed var(--yellow);border-radius:12px;padding:12px 14px;margin-top:14px}

footer{border-top:1px solid var(--line);padding:18px 0 30px;font-size:14px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
</style>
</head>

<div class="levelbar"><div class="wrap">

      { type:'voks', id:'t1-voks', tittel:"Du er et ledd i kjeden", tekst:["En vare går gjennom mange hender før den havner i butikkhylla. Fabrikken, sentrallageret, regionlageret, sjåføren, butikken – alle er avhengige av at leddet før dem har gjort jobben sin.", "Når én person kommer for sent, plukker feil eller glemmer å si fra, merkes det et annet sted i kjeden. Kanskje er det en tom hylle. Kanskje er det en kunde som venter forgjeves.", "Å ta ansvar på jobb handler mye om dette: å gjøre din del ordentlig, også når ingen ser deg."], sporsmal:["Hvem er avhengig av at du gjør jobben din i dag – på skolen, i praksis eller på jobb?", "Tenk på en gang noen andre ikke gjorde sin del. Hvordan påvirket det deg?"], handling:"Legg merke til én gang i løpet av uka der du gjør din del litt bedre enn nødvendig." },

/* De fire fasene på TLLfluenseren. En aktivitet kan overstyre med feltet fase:'laer'|'ov'|'tenk'|'voks'. */
const FASER = [
  {id:'laer', nr:'01', ikon:'↗', navn:'Lær', tekst:'Få tak på det viktigste. Tydelige forklaringer, eksempler og fagstoff.'},
  {id:'ov',   nr:'02', ikon:'✓', navn:'Øv',  tekst:'Tren på det du skal mestre. Repetisjon og interaktive oppgaver.'},
  {id:'tenk', nr:'03', ikon:'?', navn:'Tenk', tekst:'Stopp opp og vurder. Situasjoner fra arbeidslivet som utfordrer faglig skjønn.'},
  {id:'voks', nr:'04', ikon:'+', navn:'Voks', tekst:'Korte perspektiver på ansvar, samarbeid, vaner og det å fungere godt i arbeidslivet.'}
];
const FASE_AV_TYPE = {flash:'laer', quiz:'ov', match:'ov', order:'ov', sort:'ov', calc:'ov', case:'tenk', sim:'tenk', reflect:'tenk', voks:'voks'};
const faseAv = a => a.fase || FASE_AV_TYPE[a.type];
const faseNavn = id => FASER.find(f => f.id === id).navn;
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = s => String(s).replace(/<[^>]+>/g,'');
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));

/* --- lagring (bare i denne nettleseren) --- */
const KEY = 'tll-' + K.id;
let store = {lvl:0, best:{}, saveText:false};   // saveText:false = delt PC, skriftlige svar lagres ikke
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) store = Object.assign(store, s); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} };
const setBest = (id, pct) => { pct = Math.round(pct); if (!(store.best[id] >= pct)) { store.best[id] = pct; save(); } };

/* Skriftlige svar: lagres i nettleseren bare hvis eleven har valgt «Min egen PC».
   Ellers holdes teksten bare i minnet mens siden er åpen. */
const TXT = KEY + '-txt-';
const mem = {};
const getText = id => { if (store.saveText){ try { return localStorage.getItem(TXT + id) || ''; } catch(e){ return ''; } } return mem[id] || ''; };
const setText = (id, v) => { mem[id] = v; if (store.saveText){ try { localStorage.setItem(TXT + id, v); } catch(e){} } };
const delText = id => { delete mem[id]; try { localStorage.removeItem(TXT + id); } catch(e){} };
const allTextKeys = () => { const out = []; try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.indexOf(TXT) === 0) out.push(k); } } catch(e){} return out; };
const clearTexts = () => { allTextKeys().forEach(k => { try { localStorage.removeItem(k); } catch(e){} }); Object.keys(mem).forEach(k => delete mem[k]); };
const clearAll = () => { clearTexts(); try { localStorage.removeItem(KEY); } catch(e){} store = {lvl:0, best:{}, saveText:false}; };
function textNote(id){
  return store.saveText
    ? `<div class="note warn" id="tnote"><span aria-hidden="true">💾</span><span><b>Lagres på denne PC-en.</b> Teksten din lagres i nettleseren, og andre som bruker PC-en kan se den. Ingenting sendes til læreren. <button class="linkbtn" id="tdel">Slett teksten</button> · <a href="#/lagring">Endre</a></span></div>`
    : `<div class="note" id="tnote"><span aria-hidden="true">🔒</span><span><b>Lagres ikke.</b> Teksten blir borte når du lukker siden. Skal du levere den, trykker du «Kopier tekst» og limer den inn der læreren ber om det. <a href="#/lagring">Endre</a></span></div>`;
}

/* --- tema --- */
try { const t = localStorage.getItem('tll-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || 'dark';
  const nxt = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = nxt;
  try { localStorage.setItem('tll-theme', nxt); } catch(e){}
};

/* --- opplesning --- */
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
const canSpeak = 'speechSynthesis' in window;
function speak(text){
  if (!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(strip(text));
  u.lang = 'nb-NO'; u.rate = 0.95;
  const v = speechSynthesis.getVoices().find(v => /^(nb|no|nn)/i.test(v.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
const sayBtn = txt => canSpeak ? `<button class="say" data-say="${esc(strip(txt))}" title="Les opp" aria-label="Les opp">${SPK}</button>` : '';
document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b){ e.stopPropagation(); speak(b.dataset.say); } });

/* --- nivåvelger --- */
function renderLevels(){
  const cols = {0:'var(--yellow)',1:'var(--n1)',2:'var(--n2)',3:'var(--n3)'};
  $('#levels').innerHTML = [1,2,3,0].map(n =>
    `<button data-lvl="${n}" aria-pressed="${store.lvl===n}"><span class="dot" style="background:${cols[n]}"></span>${n===0?'Alle':NIVA[n]}</button>`).join('');
  $('#levels').querySelectorAll('button').forEach(b => b.onclick = () => { store.lvl = +b.dataset.lvl; save(); renderLevels(); route(); });
}
const visible = a => !a.nivaa || store.lvl === 0 || a.nivaa === store.lvl;

}
$('#ftr').innerHTML = `${esc(K.fag)} · Kapittel ${K.nr}. Tekster og oppgaver er egenprodusert. Fagstoff fra <a href="${K.ressurser.ndlaEmne}" target="_blank" rel="noopener">NDLA</a> er lenket til, ikke kopiert. Kompetansemål fra Utdanningsdirektoratet (NLOD). Henvisninger til arbeidsboka gjelder oppgavenummer i elevens egen bok. Resultater lagres bare i nettleseren på denne enheten, og ingenting sendes til læreren – <a href="#/lagring">les om lagring</a>.`;

/* --- fremdrift --- */
function temaProg(t){
  const acts = t.aktiviteter.filter(visible);
  const done = acts.filter(a => store.best[a.id] != null).length;
  return {done, total: acts.length};
}

/* =================== PODKAST ===================
   Lydfiler legges i mappen lyd/ ved siden av denne siden:
   lyd/episode-1.mp3, lyd/episode-2.mp3 … (nummer = temaets plass i lista). .m4a fungerer også.
   Finnes ikke filen, vises ingen spiller. */
const POD_EXT = ['mp3','m4a'];
const podCache = {};
function findEpisode(nr, onFound){
  if (podCache[nr] !== undefined){ if (podCache[nr]) onFound(podCache[nr]); return; }
  let i = 0;
  const tryNext = () => {
    if (i >= POD_EXT.length){ podCache[nr] = null; return; }
    const src = `lyd/episode-${nr}.${POD_EXT[i++]}`;
    const a = new Audio(); a.preload = 'metadata';
    a.onloadedmetadata = () => { a.onerror = null; a.onloadedmetadata = null; podCache[nr] = src; onFound(src); };
    a.onerror = tryNext;
    a.src = src;
  };
  tryNext();
}
function podPlayer(nr, t, src){
  const tittel = (t.podkast && t.podkast.tittel) || t.tittel;
  return `<div class="panel pod" style="margin-bottom:14px">
    <div class="row"><span class="pod-ic" aria-hidden="true">🎧</span><div><div class="ftag">Podkast · Episode ${nr}</div><h3 style="font-size:20px;margin-top:2px">${esc(tittel)}</h3></div></div>
    <audio controls preload="none" src="${esc(src)}" style="width:100%;margin-top:10px"></audio>
    <div class="row small" style="margin-top:6px"><span class="muted">Fart:</span>
      ${[0.75,1,1.25,1.5].map(v => `<button class="spd" data-r="${v}" aria-pressed="${v===1}">${String(v).replace('.',',')}×</button>`).join('')}
      <span class="spacer"></span><span class="muted">Stemmene er KI-generert.</span></div></div>`;
}
function wirePlayer(el){
  const au = el.querySelector('audio');
  el.querySelectorAll('.spd').forEach(b => b.onclick = () => { au.playbackRate = +b.dataset.r; el.querySelectorAll('.spd').forEach(x => x.setAttribute('aria-pressed', x===b)); });
}
function actCard(t,a){
  const n = a.nivaa || 0;
  const b = store.best[a.id];
  return `<a class="act" data-n="${n}" href="#/${t.id}/${a.id}">
    <span class="ftag">${faseNavn(faseAv(a))}</span>
    <div class="kind"><span>${TYPE[a.type]}</span><span class="lvl n${n}">${n ? NIVA_KORT[n] : 'Alle'}</span></div>
    <h4>${esc(a.tittel)}</h4>
    <div class="small">${b != null ? `<span class="done">✓ Beste: ${b} %</span>` : '<span class="muted">Ikke gjort</span>'}</div></a>`;
}

}

function runVoks(st, a, done){
  const all = a.tekst.join(' ');
  st.innerHTML = `<div class="row" style="margin-bottom:8px"><span class="ftag">Voks · 60 sekunder</span><span class="spacer"></span>${sayBtn(all)}</div>
    <div class="panel voks-text">${a.tekst.map(p => `<p>${esc(p)}</p>`).join('')}</div>
    <h3 style="font-size:22px;margin-top:18px">Tenk over</h3>
    ${a.sporsmal.map((q,i) => `<div class="voks-q">${i+1}. ${esc(q)}</div>`).join('')}
    <p class="instr" style="margin-top:8px">Du kan skrive ned tankene dine, men du må ikke. Snakk gjerne med en medelev i stedet.</p>
    ${textNote(a.id)}
    <textarea id="ta" placeholder="Mine tanker (valgfritt) …" style="min-height:110px">${esc(getText(a.id))}</textarea>
    <div class="row" style="margin-top:10px"><span class="spacer"></span><button class="btn ghost" id="cp">Kopier tekst</button></div>
    <div class="voks-do"><b>Ta med deg:</b> ${esc(a.handling)}</div>
    <div class="row" style="margin-top:16px"><span class="spacer"></span><button class="btn yellow" id="fin">Ferdig – jeg har tenkt over dette</button></div><div id="vr"></div>`;
  const ta = $('#ta');
  ta.oninput = () => setText(a.id, ta.value);
  wireTextNote(a.id, ta);
  $('#cp').onclick = () => copyText(ta, $('#cp'));
  $('#fin').onclick = () => { done(100); $('#vr').innerHTML = '<div class="fb" style="margin-top:12px"><b>Bra!</b> Voks handler om små steg. Prøv «Ta med deg» denne uka.</div>'; };
}
function wireTextNote(id, ta){
  const d = $('#tdel'); if (d) d.onclick = () => { delText(id); ta.value = ''; ta.dispatchEvent(new Event('input')); delText(id); d.textContent = 'Slettet ✓'; };
}
function copyText(ta, btn){
  ta.select();
  try { navigator.clipboard.writeText(ta.value); } catch(e){ try { document.execCommand('copy'); } catch(e2){} }
  btn.textContent = 'Kopiert ✓';
}

function resultBox(pct, again, extra){
  const msg = pct >= 90 ? 'Råsterkt! Du har god kontroll på dette.' : pct >= 70 ? 'Bra jobbet! Se over det du bommet på.' : pct >= 50 ? 'Godt i gang. Les «Kort fortalt» og prøv igjen.' : 'Les fagstoffet en gang til, og prøv på nytt.';
  return `<div class="panel result"><div class="big">${Math.round(pct)} %</div><div class="msg">${msg}</div>${extra||''}
    <div class="row" style="justify-content:center"><button class="btn" id="again">Prøv igjen</button></div></div>`;
}

function runFlash(st, a, done){
  let order = a.kort.map((_,i)=>i), i = 0, seen = new Set();
  const draw = () => {
    const [f,b] = a.kort[order[i]];
    st.innerHTML = `<p class="instr">Trykk på kortet for å snu det. Bruk pilene for å bla.</p>
      <div class="flash" id="fc"><div class="inner">
        <div class="face front">${esc(f)}<div class="hint">Trykk for å snu</div></div>
        <div class="face back">${esc(b)}</div></div></div>
      <div class="row"><button class="btn ghost" id="prev" aria-label="Forrige">←</button>
        <span class="counter">${i+1} / ${a.kort.length}</span>
        <button class="btn ghost" id="next" aria-label="Neste">→</button>
        <span class="spacer"></span>${sayBtn(f + '. ' + b)}
        <button class="btn ghost" id="mix">Bland</button></div>`;
    const fc = $('#fc');
    fc.onclick = () => { fc.classList.toggle('flipped'); seen.add(order[i]); if (seen.size === a.kort.length) done(100); };
    $('#prev').onclick = () => { i = (i - 1 + a.kort.length) % a.kort.length; draw(); };
    $('#next').onclick = () => { i = (i + 1) % a.kort.length; draw(); };
    $('#mix').onclick = () => { order = shuffle(order); i = 0; draw(); };
  };
  draw();
}

function runQuiz(st, a, done, t, opts){
  opts = opts || {};
  const qs = opts.questions || shuffle(a.sp);
  let i = 0, score = 0; const wrong = [];
  const draw = () => {
    const q = qs[i];
    const ord = shuffle(q.a.map((_,k)=>k));
    st.innerHTML = `<div class="row"><span class="counter">Spørsmål ${i+1} av ${qs.length}</span><span class="spacer"></span><span class="counter">${score} riktige</span></div>
      <div class="meter"><i style="width:${100*i/qs.length}%"></i></div>
      ${q._tema ? `<div class="small muted">${esc(q._tema)}</div>` : ''}
      <div class="q"><span>${esc(q.q)}</span>${sayBtn(q.q + '. ' + ord.map((k,n)=>'ABCD'[n] + ': ' + q.a[k]).join('. '))}</div>
      <div class="opts">${ord.map((k,n) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[n]}</span><span>${esc(q.a[k])}</span></button>`).join('')}</div>
      <div id="fb"></div>`;
    st.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === q.r;
      if (ok) score++; else wrong.push(q);
      st.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.k === q.r) x.classList.add('ok'); });
      if (!ok) b.classList.add('bad');
      $('#fb').innerHTML = `<div class="fb ${ok?'':'bad'}"><b>${ok ? 'Riktig!' : 'Ikke helt.'}</b> ${esc(q.f||'')}</div>
        <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn yellow" id="nx">${i+1<qs.length ? 'Neste →' : 'Se resultat'}</button></div>`;
      $('#nx').focus();
      $('#nx').onclick = () => { i++; i < qs.length ? draw() : finish(); };
    });
  };
  const finish = () => {
    const pct = 100*score/qs.length; done(pct);
    let extra = '';
    if (opts.perTema){
      const m = {}; qs.forEach(q => { m[q._tema] = m[q._tema] || {r:0,n:0}; m[q._tema].n++; if (!wrong.includes(q)) m[q._tema].r++; });
      extra = `<div style="text-align:left;max-width:440px;margin:0 auto 16px">${Object.entries(m).map(([k,v]) =>
        `<div class="row small" style="padding:4px 0;border-top:1px solid var(--line)"><span>${esc(k)}</span><span class="spacer"></span><b style="color:${v.r===v.n?'var(--ok)':'var(--bad)'}">${v.r}/${v.n}</b></div>`).join('')}</div>`;
    }
    st.innerHTML = resultBox(pct, true, `<p class="muted">${score} av ${qs.length} riktige</p>${extra}`);
    $('#again').onclick = () => opts.restart ? opts.restart() : runQuiz(st, a, done, t);
  };
  draw();
}

function runMatch(st, a, done){
  const L = shuffle(a.par.map((p,i)=>({t:p[0],i}))), R = shuffle(a.par.map((p,i)=>({t:p[1],i})));
  let sel = null, errors = 0, matched = 0;
  st.innerHTML = `<p class="instr">${esc(a.instr||'Koble sammen.')}</p>
    <div class="match"><div class="col">${L.map(x=>`<button class="mi left" data-s="L" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div>
    <div class="col">${R.map(x=>`<button class="mi" data-s="R" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div></div>
    <p class="counter" id="mc" style="margin-top:12px">0 av ${a.par.length} koblet · 0 feil</p><div id="mr"></div>`;
  st.querySelectorAll('.mi').forEach(b => b.onclick = () => {
    if (b.classList.contains('done')) return;
    if (!sel || sel.dataset.s === b.dataset.s){ if (sel) sel.classList.remove('sel'); sel = b; b.classList.add('sel'); return; }
    if (sel.dataset.i === b.dataset.i){
      [sel,b].forEach(x => { x.classList.remove('sel'); x.classList.add('done'); x.disabled = true; }); matched++;
    } else {
      errors++; const s = sel; [s,b].forEach(x => { x.classList.remove('wrong'); void x.offsetWidth; x.classList.add('wrong'); });
      s.classList.remove('sel');
    }
    sel = null;
    $('#mc').textContent = `${matched} av ${a.par.length} koblet · ${errors} feil`;
    if (matched === a.par.length){
      const pct = 100*a.par.length/(a.par.length+errors); done(pct);
      $('#mr').innerHTML = resultBox(pct); $('#again').onclick = () => runMatch(st,a,done);
    }
  });
}

function runOrder(st, a, done){
  let cur = shuffle(a.steg.map((s,i)=>i));
  while (a.steg.length > 1 && cur.every((v,i)=>v===i)) cur = shuffle(cur);
  let tries = 0;
  const draw = (checked) => {
    st.innerHTML = `<p class="instr">${esc(a.instr)} Flytt med pilene.</p>
      <ol class="olist">${cur.map((k,p) => `<li class="oi ${checked ? (k===p?'ok':'bad') : ''}">
        <span class="n">${p+1}</span><span class="t">${esc(a.steg[k])}</span>
        <span class="mv"><button data-up="${p}" aria-label="Flytt opp" ${p===0?'disabled':''}>▲</button><button data-dn="${p}" aria-label="Flytt ned" ${p===cur.length-1?'disabled':''}>▼</button></span></li>`).join('')}</ol>
      <div class="row" style="margin-top:14px"><span class="counter">Forsøk: ${tries}</span><span class="spacer"></span><button class="btn yellow" id="chk">Sjekk rekkefølgen</button></div><div id="or"></div>`;
    st.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { const p=+b.dataset.up; [cur[p-1],cur[p]]=[cur[p],cur[p-1]]; draw(); });
    st.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => { const p=+b.dataset.dn; [cur[p+1],cur[p]]=[cur[p],cur[p+1]]; draw(); });
    $('#chk').onclick = () => {
      tries++;
      const right = cur.filter((k,p)=>k===p).length;
      draw(true);
      if (right === cur.length){
        const pct = Math.max(40, 100 - (tries-1)*20); done(pct);
        $('#or').innerHTML = `<div class="fb"><b>Helt riktig!</b> ${tries===1?'På første forsøk.':`Du brukte ${tries} forsøk.`}</div>` + resultBox(pct);
        $('#again').onclick = () => runOrder(st,a,done);
        st.querySelectorAll('.mv button,#chk').forEach(b=>b.disabled=true);
      } else {
        $('#or').innerHTML = `<div class="fb bad"><b>${right} av ${cur.length} står riktig.</b> De grønne står på riktig plass. Flytt de røde og sjekk igjen.</div>`;
      }
    };
  };
  draw();
}

function runSort(st, a, done){
  const items = shuffle(a.items.map((x,i)=>({t:x[0],k:x[1],why:x[2]||'',i})));
  const ans = {};
  st.innerHTML = `<p class="instr">${esc(a.instr)}</p>
    <div class="sitems">${items.map(x => `<div class="si" data-i="${x.i}"><div class="t">${esc(x.t)}</div>

    <div class="row" style="margin-top:14px"><span class="counter" id="sc">0 av ${items.length} plassert</span><span class="spacer"></span><button class="btn yellow" id="chk" disabled>Sjekk svarene</button></div><div id="sr"></div>`;
  st.querySelectorAll('.si').forEach(el => {
    el.querySelectorAll('button').forEach(b => b.onclick = () => {
      ans[el.dataset.i] = +b.dataset.c;

    });

  $('#chk').onclick = () => {
    let r = 0;
    items.forEach(x => {
      const el = st.querySelector(`.si[data-i="${x.i}"]`), ok = ans[x.i] === x.k; if (ok) r++;
      el.classList.remove('ok','bad'); el.classList.add(ok?'ok':'bad');

      el.querySelectorAll('button').forEach(b => b.disabled = true);
    });
    const pct = 100*r/items.length; done(pct);
    $('#chk').hidden = true;
    $('#sr').innerHTML = resultBox(pct, true, `<p class="muted">${r} av ${items.length} riktige</p>`);
    $('#again').onclick = () => runSort(st,a,done);
  };
}

/* Regneoppgaver: generatorer */
const VARER = ['vaskemiddel','kaffe','hermetikk','toalettpapir','kopipapir','hundefôr','oppvasktabletter','brus'];
const GEN = {
  saldo(){ const s=rnd(8,40), inn=rnd(0,1)?rnd(5,24):0, p=rnd(2,Math.min(30,s+inn)); const v=VARER[rnd(0,VARER.length-1)];
    return { task:`En lokasjon med ${v} har <b>${s}</b> kartonger når dagen starter. I løpet av dagen ryddes <b>${inn}</b> nye kartonger inn, og det plukkes <b>${p}</b> kartonger. Hva er lagersaldoen ved slutten av dagen?`,
      ans:s+inn-p, unit:'kartonger', steps:[`Saldo = start + inn − plukket`,`${s} + ${inn} − ${p} = <b>${s+inn-p}</b> kartonger`] }; },
  bp(){ const f=rnd(1,8), l=rnd(2,10); const v=VARER[rnd(0,VARER.length-1)];
    return { task:`Regionlageret selger i gjennomsnitt <b>${f}</b> kartonger ${v} per dag. Ledetida fra bestilling til leveranse er <b>${l}</b> dager. Hvor mange kartonger skal saldoen vise når systemet foreslår ny bestilling (bestillingspunktet)? Regn uten sikkerhetslager.`,
      ans:f*l, unit:'kartonger', steps:[`Bestillingspunkt = forbruk per dag × ledetid`,`${f} × ${l} = <b>${f*l}</b> kartonger`,`Da kommer de nye varene omtrent når lageret er tomt.`] }; },
  bpsl(){ const f=rnd(2,12), l=rnd(3,12), sl=rnd(1,4)*f; const v=VARER[rnd(0,VARER.length-1)];
    return { task:`Et lager selger <b>${f}</b> kartonger ${v} per dag. Ledetida er <b>${l}</b> dager. Lageret vil ha et sikkerhetslager på <b>${sl}</b> kartonger. Hvor ligger bestillingspunktet?`,
      ans:f*l+sl, unit:'kartonger', steps:[`Forbruk i ledetida = ${f} × ${l} = ${f*l}`,`Bestillingspunkt = forbruk i ledetida + sikkerhetslager`,`${f*l} + ${sl} = <b>${f*l+sl}</b> kartonger`] }; },
  pall(){ const n=rnd(1,3)===1?33:rnd(12,66), pr=[90,100,110,120,125,130][rnd(0,5)];
    return { task:`En leveranse kommer med <b>${n}</b> europaller. Leverandøren belaster <b>${pr} kr</b> per pall i tillegg til varene. Hva er samlet pallverdi?`,
      ans:n*pr, unit:'kr', steps:[`Pallverdi = antall paller × pris per pall`,`${n} × ${pr} = <b>${(n*pr).toLocaleString('nb-NO')}</b> kr`, n===33?'(En fullastet semitrailer har plass til 33 paller i ett plan.)':''] }; }
};
function runCalc(st, a, done){
  const n = a.antall || 5; let i = 0, score = 0, tryN = 0, cur;
  const draw = () => {
    cur = GEN[a.gen](); tryN = 0;
    st.innerHTML = `<div class="row"><span class="counter">Oppgave ${i+1} av ${n}</span><span class="spacer"></span><span class="counter">${score} riktige</span></div>
      <div class="meter"><i style="width:${100*i/n}%"></i></div>
      <div class="calc panel"><div class="task">${cur.task}</div>
      <div class="row"><input id="in" type="number" inputmode="numeric" aria-label="Svar"><span class="unit">${cur.unit}</span>
      <button class="btn yellow" id="chk">Sjekk</button><span class="spacer"></span>${sayBtn(cur.task)}</div><div id="cf"></div></div>`;
    const inp = $('#in'); inp.focus();
    inp.onkeydown = e => { if (e.key === 'Enter') $('#chk').click(); };
    $('#chk').onclick = () => {
      if (inp.value === '') return;
      const v = Number(inp.value), ok = v === cur.ans; tryN++;
      if (ok || tryN >= 2){
        if (ok && tryN === 1) score++; else if (ok) score += 0.5;
        inp.disabled = true; $('#chk').disabled = true;
        $('#cf').innerHTML = `<div class="fb ${ok?'':'bad'}"><b>${ok ? 'Riktig!' : 'Riktig svar er ' + cur.ans.toLocaleString('nb-NO') + ' ' + cur.unit + '.'}</b>
          <ul class="steps">${cur.steps.filter(Boolean).map(s=>`<li>${s}</li>`).join('')}</ul></div>
          <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn yellow" id="nx">${i+1<n?'Neste →':'Se resultat'}</button></div>`;
        $('#nx').focus(); $('#nx').onclick = () => { i++; i<n ? draw() : fin(); };
      } else {
        $('#cf').innerHTML = `<div class="fb bad"><b>Ikke riktig – prøv én gang til.</b> Tips: ${cur.steps[0]}</div>`;
        inp.select();
      }
    };
  };
  const fin = () => { const pct = 100*score/n; done(pct); st.innerHTML = resultBox(pct,true,`<p class="muted">Nye tall hver gang du prøver.</p>`); $('#again').onclick = () => runCalc(st,a,done); };
  draw();
}

function runSim(st, a, done){
  const DAYS = 20, LEAD = 3, QTY = 12, SALE = [1,2,3];
  let day, stock, pending, empties, lost, hist, log;
  const reset = () => { day=1; stock=10; pending=[]; empties=0; lost=0; hist=[10]; log=[]; draw(); };
  const draw = () => {
    const onOrder = pending.length > 0;
    st.innerHTML = `<p class="instr">Du styrer lageret for én vare i ${DAYS} dager. Butikkene kjøper 1–3 kartonger per dag (snitt 2). Ledetida er ${LEAD} dager, og du bestiller ${QTY} kartonger om gangen. Målet er å <b>aldri gå tom</b> – men uten å fylle lageret for mye.</p>
      <div class="simgrid">
        <div class="stat"><div class="v">${Math.min(day,DAYS)}</div><div class="l">Dag av ${DAYS}</div></div>
        <div class="stat"><div class="v">${stock}</div><div class="l">Lagersaldo</div></div>
        <div class="stat"><div class="v">${onOrder ? 'Dag ' + pending[0] : '–'}</div><div class="l">Bestilling kommer</div></div>
        <div class="stat"><div class="v" style="color:${lost?'var(--bad)':'inherit'}">${lost}</div><div class="l">Tapt salg (kartonger)</div></div>
      </div>
      <svg class="chart" viewBox="0 0 400 170" preserveAspectRatio="none" aria-label="Lagersaldo per dag">${chart()}</svg>
      <div class="row" style="margin-top:12px">
        <button class="btn ghost" id="ord" ${onOrder||day>DAYS?'disabled':''}>Bestill ${QTY} kartonger</button>
        <span class="spacer"></span><button class="btn yellow" id="nx" ${day>DAYS?'disabled':''}>Neste dag →</button></div>
      <ul class="log">${log.slice().reverse().map(l=>`<li>${l}</li>`).join('')}</ul><div id="sres"></div>`;
    $('#ord').onclick = () => { pending = [day + LEAD]; log.push(`Dag ${day}: Bestilte ${QTY} kartonger (saldo ${stock}).`); draw(); };
    $('#nx').onclick = step;
    if (day > DAYS) finish();
  };
  const chart = () => {
    const max = 30, w = 400, h = 170, dx = w/DAYS;
    const y = v => h - 8 - (Math.min(v,max)/max)*(h-16);
    const pts = hist.map((v,i)=>`${(i*dx).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const bp = 6;
    return `<line x1="0" x2="${w}" y1="${y(bp)}" y2="${y(bp)}" stroke="var(--n3)" stroke-dasharray="4 4" stroke-width="1.5"/>
      <text x="${w-4}" y="${y(bp)-4}" text-anchor="end" font-size="11" fill="var(--n3)">bestillingspunkt uten buffer = 2 × 3 = 6</text>
      <line x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}" stroke="var(--bad)" stroke-width="1"/>
      <polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
      ${hist.map((v,i)=>`<circle cx="${i*dx}" cy="${y(v)}" r="3" fill="${v===0?'var(--bad)':'var(--yellow)'}"/>`).join('')}`;
  };
  const step = () => {
    if (pending[0] === day){ stock += QTY; pending = []; log.push(`Dag ${day}: ${QTY} kartonger kom inn.`); }
    const d = SALE[rnd(0,2)], sold = Math.min(d, stock);
    stock -= sold;
    if (sold < d){ lost += d - sold; empties++; log.push(`Dag ${day}: Butikkene ville ha ${d}, men bare ${sold} fantes. Tomt!`); }
    else log.push(`Dag ${day}: Solgte ${d}. Saldo ${stock}.`);
    hist.push(stock); day++; draw();
  };
  const finish = () => {
    const avg = hist.reduce((s,v)=>s+v,0)/hist.length;
    let pct = 100 - lost*12 - Math.max(0, avg-12)*3; pct = Math.max(0, Math.min(100, pct));
    done(pct);
    $('#sres').innerHTML = `<div class="panel" style="margin-top:14px"><b>Ferdig!</b> Tapt salg: ${lost} kartonger. Gjennomsnittlig lagersaldo: ${avg.toFixed(1)} kartonger. Poeng: ${Math.round(pct)} %.
      <p class="small" style="margin:8px 0 0">Tips: Med salg på ca. 2 per dag og ledetid 3 dager bør du bestille når saldoen er rundt 2 × 3 = 6. Fordi salget svinger (opptil 3 per dag), trenger du i tillegg et lite <b>sikkerhetslager</b> – bestill når saldoen er 8–9.</p>
      <div class="row" style="margin-top:10px"><span class="spacer"></span><button class="btn" id="again">Spill igjen</button></div></div>`;
    $('#again').onclick = reset;
  };
  reset();
}

/* Kapittelprøve */
function pageProve(){
  header(`<a href="#/">Kap ${K.nr}</a>`, 'Kapittelprøve', `ØV · ${NIVA[store.lvl]} · 15 tilfeldige spørsmål fra hele kapitlet`, false);
  app.innerHTML = `<div class="stage" id="stage"></div><p class="stage" style="margin-top:22px"><a href="#/">← Tilbake til alle tema</a></p>`;
  const start = () => {
    let pool = [];
    K.temaer.forEach(t => t.aktiviteter.filter(a => a.type === 'quiz' && visible(a)).forEach(a => a.sp.forEach(q => pool.push(Object.assign({_tema:t.tittel}, q)))));
    const qs = shuffle(pool).slice(0, 15);
    if (!qs.length){ $('#stage').innerHTML = '<p class="muted">Ingen spørsmål på dette nivået.</p>'; return; }
    runQuiz($('#stage'), {sp:qs}, pct => setBest('prove', pct), null, {questions:qs, perTema:true, restart:start});
  };
  start();
}

/* =================== RUTING =================== */
function route(){
  if (canSpeak) speechSynthesis.cancel();
  const parts = location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  if (parts[0] === 'prove') pageProve();
  else if (parts[0] === 'lagring') pageLagring();
  else {
    const t = K.temaer.find(x => x.id === parts[0]);
    const a = t && t.aktiviteter.find(x => x.id === parts[1]);
    if (t && a) pageAct(t,a); else if (t) pageTema(t); else pageHome();
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
renderLevels(); route();
})();
</script>
