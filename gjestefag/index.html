<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/styles.css">
<link rel="stylesheet" href="/assets/global-footer.css"><script defer src="/assets/global-footer.js?v=mobile-nav-2"></script><link rel="stylesheet" href="/assets/elevflyt.css?v=mobile-nav-2">
<link rel="stylesheet" href="/gjestefag/felles/gjesterom.css">
<title>Gjestefag | TLLfluenseren</title>
</head>
<body class="gjest-area">
<a class="tll-skip" href="#tll-main">Hopp til innhold</a>
<header class="gjest-header gjest-shell noprint"><a class="gjest-brand" href="/" aria-label="TLLfluenseren – gå til forsiden"><span class="brandmark">TLL</span><span>TLLfluenseren<small>Gjesterommet</small></span></a><span class="gjest-merke"><i></i>Gjestefag</span></header>
<nav class="tll-site-nav tll-standalone-nav" aria-label="Hovedmeny"><a href="/">Forside</a><a href="/#fag">Fagområder</a><a href="/gjestefag/">Gjestefag</a><a href="/ressursbank/">Ressursbank</a><a href="/om/">Om</a></nav>
<main id="tll-main" class="gjest-shell" tabindex="-1">
<section class="gjest-intro">
  <div class="gjest-eyebrow">Gjesterommet</div>
  <h1>Gjestefag</h1>
  <p>Andre programfag låner plass på TLLfluenseren. Hvert gjestefag har åpne elevressurser og et eget lærerrom med passord for faglærerne.</p>
</section>
<div class="gjest-grid" id="fagliste"></div>
</main>
<script type="module">
import { FAG } from '/gjestefag/felles/fag.js';
document.getElementById('fagliste').innerHTML = FAG.map(f => `<article class="gjest-card" style="border-top:4px solid ${f.farge}"><span class="tag" style="color:${f.farge};border-color:${f.farge}">${f.kort}</span><h3>${f.navn}</h3><p>${f.beskrivelse}</p><a class="lenke" style="color:${f.farge}" href="/gjestefag/${f.id}/">Elevressurser →</a><a class="lenke" style="color:${f.farge}" href="/gjestefag/${f.id}/laererrom/">Lærerrom (passord) →</a></article>`).join('');
</script>
</body>
</html>
